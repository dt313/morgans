$schema: "https://moonrepo.dev/schemas/project.json"

language: python

tasks:
  dev:
    command: uv
    args:
      - run
      - --env-file
      - .env.dev
      - "--"
      - uvicorn
      - src.main:app
      - --reload

  staging:
    command: uv
    args:
      - run
      - --env-file
      - .env.staging
      - "--"
      - uvicorn
      - src.main:app
      - --reload

  prod:
    command: uv
    args:
      - run
      - --env-file
      - .env.prod
      - "--"
      - uvicorn
      - src.main:app

  test:
    command: "uv run pytest"

  lint:
    command: "uv run ruff check ."

  format:
    command: "uv run ruff format ."
