$schema: "https://moonrepo.dev/schemas/project.json"

language: javascript

tasks:
  install:
    command: pnpm install

  dev:
    command: pnpm dev
    options:
      envFile: .env.dev

  build:
    command: pnpm build
    options:
      envFile: .env.prod

  start:
    command: pnpm start
    options:
      envFile: .env.prod
    deps:
      - build

  lint:
    command: pnpm lint
